# Publishes the editor/ folder as the site root on GitHub Pages (custom domain: dc.elimssmile.dev).
# One-time setup: repo Settings → Pages → Source: "GitHub Actions", then set the custom domain there.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: editor
      - id: deployment
        uses: actions/deploy-pages@v4
